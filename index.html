<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento - Paraíba Carmotos</title>

  <!-- Biblioteca para gerar PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f7f7f7;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #d32f2f;
    }

    form {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #b71c1c;
    }

    #btnWhatsApp {
      background-color: #25D366;
    }

    #btnWhatsApp:hover {
      background-color: #1ebe5d;
    }
  </style>
</head>

<body>
  <h1>Orçamento - Paraíba Carmotos</h1>

  <form id="formOrcamento" method="POST">
    <label for="nome">Nome</label>
    <input type="text" id="nome" required />

    <label for="telefone">Telefone (com DDD)</label>
    <input type="text" id="telefone" placeholder="ex: 83999999999" required />

    <label for="servico">Serviço</label>
    <input type="text" id="servico" placeholder="Ex: Troca de óleo, revisão..." required />

    <label for="valor">Valor (R$)</label>
    <input type="number" id="valor" placeholder="Ex: 250" required />

    <button type="button" id="gerarPDF">Gerar PDF</button>
    <button type="button" id="btnWhatsApp">Abrir no WhatsApp</button>
  </form>

  <script>
    // Função para gerar PDF
    document.getElementById("gerarPDF").addEventListener("click", function () {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const nome = document.getElementById("nome").value;
      const telefone = document.getElementById("telefone").value;
      const servico = document.getElementById("servico").value;
      const valor = document.getElementById("valor").value;

      if (!nome || !telefone || !servico || !valor) {
        alert("Por favor, preencha todos os campos antes de gerar o PDF!");
        return;
      }

      doc.text("Orçamento - Paraíba Carmotos", 10, 10);
      doc.text(`Nome: ${nome}`, 10, 20);
      doc.text(`Telefone: ${telefone}`, 10, 30);
      doc.text(`Serviço: ${servico}`, 10, 40);
      doc.text(`Valor: R$ ${valor}`, 10, 50);
      doc.text("Obrigado por solicitar um orçamento conosco!", 10, 70);

      doc.save(`Orçamento-${nome}.pdf`);
    });

    // Função para abrir WhatsApp
    document.getElementById("btnWhatsApp").addEventListener("click", function () {
      const telefone = document.getElementById("telefone").value.trim();

      if (!telefone) {
        alert("Digite o número de telefone para abrir o WhatsApp!");
        return;
      }

      const numeroLimpo = telefone.replace(/\D/g, "");
      const mensagem = encodeURIComponent("Olá, vi o orçamento e gostaria de mais informações!");
      const url = `https://wa.me/${numeroLimpo}?text=${mensagem}`;
      window.open(url, "_blank");
    });

</body>
</html>
