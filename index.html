
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento Online - Paraíba Carmoto's</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { text-align: center; color: #333; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 15px; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #cronograma { margin-top: 30px; background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; margin: 30px auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Orçamento Online - Paraíba Carmoto's</h1>
    <form id="orcamentoForm">
        <label for="nome">Nome do Cliente:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="placa">Placa do Carro:</label>
        <input type="text" id="placa" name="placa" required>

        <label for="modelo">Modelo do Carro:</label>
        <input type="text" id="modelo" name="modelo" required>

        <label for="servico">Tipo de Serviço:</label>
        <input type="text" id="servico" name="servico" required>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <button type="button" onclick="gerarPDF()">Gerar PDF do Orçamento</button>
    </form>

    <div id="cronograma">
        <h2>Cronograma de Serviços</h2>
        <p>Aqui será exibido o status dos serviços agendados.</p>
    </div>

    <script>
        function gerarPDF() {
            const nome = document.getElementById('nome').value;
            const placa = document.getElementById('placa').value;
            const modelo = document.getElementById('modelo').value;
            const servico = document.getElementById('servico').value;
            const telefone = document.getElementById('telefone').value;
            const email = document.getElementById('email').value;

            const conteudo = `Orçamento Online - Paraíba Carmoto's

Nome: ${nome}
Placa: ${placa}
Modelo: ${modelo}
Serviço: ${servico}
Telefone: ${telefone}
E-mail: ${email}`;

            const blob = new Blob([conteudo], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'orcamento.pdf';
            link.click();
        }
    </script>
</body>
</html>
