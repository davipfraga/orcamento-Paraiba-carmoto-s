
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Orçamento da Oficina</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 600px; margin: auto; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 15px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h2>Formulário de Orçamento - Oficina</h2>
    <form id="orcamentoForm">
        <label for="nome">Nome do Cliente:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="telefone">Telefone (WhatsApp):</label>
        <input type="text" id="telefone" name="telefone" required>

        <label for="modelo">Modelo do Carro:</label>
        <input type="text" id="modelo" name="modelo" required>

        <label for="placa">Placa do Carro:</label>
        <input type="text" id="placa" name="placa" required>

        <label for="servico">Serviço Desejado:</label>
        <textarea id="servico" name="servico" rows="3" required></textarea>

        <label for="valor">Valor do Orçamento (R$):</label>
        <input type="number" id="valor" name="valor" required>

        <button type="submit">Enviar para Google Planilhas</button>
        <button type="button" onclick="gerarPDF()">Gerar PDF</button>
        <button type="button" onclick="enviarWhatsApp()">Enviar via WhatsApp</button>
    </form>

    <script>
        // Submeter dados para Google Planilhas via Google Apps Script Web App
        document.getElementById("orcamentoForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch("https://script.google.com/macros/s/AKfycbyJtESKB4ScDCRVbJLerBQLPUM_iW4E0vUYs8T3Blo/dev/exec", {
                method: "POST",
                body: formData
            })
            .then(response => response.text())
            .then(result => {
                alert("Dados enviados com sucesso!");
            })
            .catch(error => {
                alert("Erro ao enviar os dados.");
                console.error(error);
            });
        });

        // Função para gerar PDF (simples)
        function gerarPDF() {
            alert("Função de geração de PDF será implementada com biblioteca como jsPDF.");
        }

        // Função para enviar via WhatsApp
        function enviarWhatsApp() {
            const telefone = document.getElementById("telefone").value;
            const nome = document.getElementById("nome").value;
            const mensagem = `Olá ${nome}, segue o orçamento do seu veículo.`;
            const link = `https://wa.me/55${telefone}?text=${encodeURIComponent(mensagem)}`;
            window.open(link, "_blank");
        }
    </script>
</body>
</html>
