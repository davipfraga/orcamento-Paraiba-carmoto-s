<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orçamento - Paraíba Carmotos</title>
<style>
  :root{
    --brand:#0a3d91;
    --accent:#c62828;
    --accent-d:#ab1f1f;
    --ok:#16a34a;
    --ok-d:#11823b;
    --bg:#f5f7fb;
    --card:#ffffff;
    --muted:#6b7280;
    --line:#e5e7eb;
    --txt:#0f172a;
    --pill:#f3f4f6;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Helvetica,Arial;color:var(--txt);background:var(--bg);}
  .container{max-width:1100px;margin:28px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.06);overflow:hidden}

  .header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px;border-bottom:1px solid var(--line)}
  .brand-left{display:flex;gap:0px;align-items:center}
  .logo{width:140px;height:70px;object-fit:contain;display:block;}
  .title{font-size:22px;font-weight:700;color:var(--brand);margin:0}
  .divider{height:3px;background:var(--accent);margin:0 22px 8px;border:0}

  .company{font-size:12px;color:#6b7280;line-height:1.4;text-align:right}
  .content{padding:16px 22px 0}

  h3.sec{margin:10px 0 8px;font-size:16px;color:#1f2937}
  label{font-size:12px;color:var(--muted)}
  .grid{display:grid;gap:10px}
  .cols-4{grid-template-columns:2fr 2fr 2fr 1fr}
  .cols-3{grid-template-columns:1.2fr 1fr 1fr}
  input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  input::placeholder{color:#9aa0a6}

  .box{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:6px;background:#fff}
  .tbl{width:100%;border-collapse:collapse}
  .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px;vertical-align:middle}

  /* ✅ CORREÇÃO DA DESCRIÇÃO */
  .tbl td {
    white-space: normal !important;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  .tbl th{background:#fafbfc;text-align:left;font-size:13px;color:#374151}
  .qty{width:80px}
  .price{width:160px}
  .actions{width:140px}

  .row-actions{display:flex;gap:6px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
  .btn.small{padding:6px 10px;font-size:12px}
  .btn.danger{background:#ef4444;color:#fff;border-color:#ef4444}
  .btn.gray{background:#f3f4f6}
  .btn.red{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.red:hover{background:var(--accent-d)}
  .btn.green{background:var(--ok);color:#fff;border-color:var(--ok)}
  .btn.green:hover{background:var(--ok-d)}

  .footer-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin:14px 0 18px}
  .totals{margin-right:auto;text-align:right}
  .totals .pill{display:inline-block;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin-left:8px;font-size:14px}
  .legal{border-top:1px solid var(--line);padding:12px 22px;color:var(--muted);font-size:12px;text-align:center;background:#fafafa}

  /* ✅ CORREÇÃO NO PDF */
  @media print{
    @page { size: A4; margin: 16mm 14mm 16mm 14mm; }
    body{background:#fff}
    .no-print{display:none !important}
    .card{border:0;box-shadow:none}

    td input {
      white-space: normal !important;
      word-break: break-word;
      overflow-wrap: break-word;
    }
  }
</style>
</head>
